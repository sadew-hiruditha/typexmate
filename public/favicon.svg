<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)"/>
  
  <!-- Keyboard keys -->
  <g fill="white" opacity="0.95">
    <!-- Top row -->
    <rect x="20" y="30" width="12" height="12" rx="2"/>
    <rect x="35" y="30" width="12" height="12" rx="2"/>
    <rect x="50" y="30" width="12" height="12" rx="2"/>
    <rect x="65" y="30" width="12" height="12" rx="2"/>
    
    <!-- Middle row -->
    <rect x="20" y="45" width="12" height="12" rx="2"/>
    <rect x="35" y="45" width="12" height="12" rx="2"/>
    <rect x="50" y="45" width="12" height="12" rx="2"/>
    <rect x="65" y="45" width="12" height="12" rx="2"/>
    
    <!-- Space bar -->
    <rect x="27" y="60" width="43" height="10" rx="2"/>
  </g>
  
  <!-- Lightning bolt (speed indicator) -->
  <path d="M 75 20 L 70 30 L 75 30 L 68 42 L 78 30 L 73 30 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="0.5"/>
</svg>
